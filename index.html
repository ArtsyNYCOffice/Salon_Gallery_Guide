<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meridian Gallery Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1B1B18;
    --ink-soft: #706C63;
    --ink-faint: #9C978C;
    --line: #E3E0D8;
    --accent: #8A6E4B;
    --accent-soft: #EFE9DF;
    --overlay: rgba(27,27,24,0.4);
    --radius-s: 2px;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121210;
      --surface: #181815;
      --ink: #F1EFE9;
      --ink-soft: #A8A399;
      --ink-faint: #706C63;
      --line: #2E2C27;
      --accent: #C9A876;
      --accent-soft: #26221A;
      --overlay: rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121210;
    --surface: #181815;
    --ink: #F1EFE9;
    --ink-soft: #A8A399;
    --ink-faint: #706C63;
    --line: #2E2C27;
    --accent: #C9A876;
    --accent-soft: #26221A;
    --overlay: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  /* ---- Header ---- */
  header {
    padding: 22px 20px 0 20px;
    flex-shrink: 0;
  }
  .gallery-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .gallery-sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 3px 0 18px 0;
  }
  .tabs {
    display: flex;
    gap: 28px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-faint);
    padding: 0 0 12px 0;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--accent);
  }

  /* ---- Content area ---- */
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Map view ---- */
  .map-wrap {
    padding: 18px 20px 40px 20px;
  }
  .room-caption {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  svg#floorplan { width: 100%; height: auto; display: block; }
  .wall-outline {
    fill: var(--surface);
    stroke: var(--ink-faint);
    stroke-width: 7;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .room-rect {
    fill: var(--accent-soft);
    fill-opacity: 0.55;
    stroke: var(--accent);
    stroke-width: 2.5;
  }
  .room-label {
    fill: var(--ink-soft);
    font-size: 34px;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
  }
  .dot {
    fill: var(--accent);
    stroke: var(--bg);
    stroke-width: 8;
    cursor: pointer;
    transition: r 0.15s ease;
  }
  .dot:active { r: 42; }
  .dot-number {
    fill: var(--bg);
    font-size: 32px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
    font-family: 'Inter', sans-serif;
  }
  .map-legend {
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .map-legend .swatch {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  /* ---- List view ---- */
  .list-wrap { padding: 6px 20px 40px 20px; }
  .room-group { margin-top: 22px; }
  .room-group:first-child { margin-top: 12px; }
  .room-title {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .art-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .art-swatch {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: var(--radius-s);
  }
  .art-info { flex: 1; min-width: 0; }
  .art-title {
    font-size: 14.5px;
    font-weight: 500;
    margin: 0 0 2px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .art-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0;
  }
  .art-arrow {
    color: var(--ink-faint);
    font-size: 15px;
    flex-shrink: 0;
  }

  /* ---- Detail sheet ---- */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 88%;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.25,.8,.35,1);
    z-index: 11;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 0 auto;
    flex-shrink: 0;
  }
  .sheet-scroll {
    overflow-y: auto;
    padding: 4px 24px 36px 24px;
  }
  .sheet-swatch {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: var(--radius-s);
    margin: 16px 0 20px 0;
  }
  .sheet-title {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 4px 0;
  }
  .sheet-artist {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 18px 0;
  }
  .sheet-facts {
    display: grid;
    grid-template-columns: 84px 1fr;
    row-gap: 8px;
    font-size: 13px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .fact-label { color: var(--ink-faint); }
  .fact-value { color: var(--ink); }
  .fact-value.locate {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .sheet-statement-label {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .sheet-statement {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-size: 16.5px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 18px;
    background: var(--accent-soft);
    color: var(--ink-soft);
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <p class="gallery-name">Meridian Gallery</p>
    <p class="gallery-sub">Visitor guide &middot; Lower Level</p>
    <div class="tabs">
      <button class="tab active" data-view="map">Map</button>
      <button class="tab" data-view="list">List</button>
    </div>
  </header>

  <main>
    <div class="view active" id="view-map">
      <div class="map-wrap">
        <p class="room-caption">Tap a marker to view the piece</p>
        <svg id="floorplan" viewBox="0 0 2222 1297" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="map-legend"><span class="swatch"></span> Artwork location</div>
      </div>
    </div>

    <div class="view" id="view-list">
      <div class="list-wrap" id="list-container"></div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="sheet-handle"></div>
    <div class="sheet-scroll" id="sheetContent"></div>
  </div>

</div>

<script>
const artworks = [
  { id:1, title:"Low Tide", artist:"Renata Solis", year:"2019", medium:"Oil on linen", dims:"120 × 90 cm", room:"Gallery I", x:530, y:187, hue:"linear-gradient(135deg,#8FA8A0,#3E5C55)",
    statement:"I keep returning to the hour when the water pulls back and leaves everything exposed. This painting isn't about the sea so much as what it uncovers." },
  { id:2, title:"Interior with Two Chairs", artist:"Marcus Feld", year:"2021", medium:"Acrylic on canvas", dims:"100 × 100 cm", room:"Gallery I", x:687, y:131, hue:"linear-gradient(135deg,#D8C7A1,#A8865A)",
    statement:"A room after an argument, or before one. I wanted the furniture to hold the tension so the people wouldn't have to." },
  { id:3, title:"Study No. 4", artist:"Renata Solis", year:"2018", medium:"Charcoal on paper", dims:"56 × 76 cm", room:"Gallery I", x:844, y:170, hue:"linear-gradient(135deg,#C9C4BC,#77716A)",
    statement:"A preliminary sketch that outgrew its purpose. Sometimes the study says more plainly what the finished piece is trying to say." },
  { id:4, title:"Static Bloom", artist:"Iris Whitfield", year:"2022", medium:"Mixed media on board", dims:"80 × 80 cm", room:"Gallery II", x:534, y:442, hue:"linear-gradient(135deg,#C97B63,#7A3B2E)",
    statement:"Flowers caught mid-decay, rendered with the same care usually reserved for their prime. Decline has its own kind of symmetry." },
  { id:5, title:"Untitled (Corridor)", artist:"Marcus Feld", year:"2020", medium:"Oil on canvas", dims:"140 × 100 cm", room:"Gallery II", x:691, y:378, hue:"linear-gradient(135deg,#8A8FA8,#4A4E66)",
    statement:"A hallway I walked through for years without seeing it. This is my attempt to finally look." },
  { id:6, title:"Ledger", artist:"Iris Whitfield", year:"2023", medium:"Ink and gold leaf on paper", dims:"45 × 60 cm", room:"Gallery II", x:848, y:424, hue:"linear-gradient(135deg,#D9C77A,#8A7220)",
    statement:"A record of small debts \u2014 favors owed, apologies unmade. The gold leaf marks the ones I never settled." },
  { id:7, title:"Coastal Fragment I", artist:"Dana Okafor", year:"2017", medium:"Bronze", dims:"38 cm height", room:"Gallery III", x:535, y:712, hue:"linear-gradient(135deg,#A89A7C,#5C5240)",
    statement:"Cast from a piece of driftwood I couldn't bring myself to burn. The bronze keeps its shape long after the wood would have given out." },
  { id:8, title:"Coastal Fragment II", artist:"Dana Okafor", year:"2017", medium:"Bronze", dims:"41 cm height", room:"Gallery III", x:692, y:648, hue:"linear-gradient(135deg,#9C9184,#4E463B)",
    statement:"The companion piece. I made these as a pair because the first felt unfinished on its own \u2014 like half a sentence." },
  { id:9, title:"Late Correspondence", artist:"Renata Solis", year:"2023", medium:"Oil on linen", dims:"150 × 110 cm", room:"Gallery III", x:848, y:694, hue:"linear-gradient(135deg,#B5876B,#623F2A)",
    statement:"Painted from a box of letters my grandmother never sent. I don't know what they said. I only know the color of the paper had faded to this." }
];

// Traced from the real 24th-floor blueprint: exterior wall line only
const wallOutlinePath = "M 40,72 L 51,410 L 128,412 L 128,494 L 45,495 L 54,749 L 226,751 L 226,913 L 193,914 L 201,957 L 226,962 L 226,1088 L 317,1089 L 318,1257 L 390,1257 L 514,1153 L 903,1153 L 1034,1250 L 1627,1250 L 1756,1147 L 2182,1146 L 2173,684 L 1682,684 L 1681,785 L 1623,784 L 1622,684 L 926,684 L 921,73 L 903,46 L 486,40 L 461,55 L 95,55 L 94,71 Z";

const rooms = [
  { name:"Gallery I",   x:456, y:44,  w:462, h:230 },
  { name:"Gallery II",  x:460, y:275, w:462, h:270 },
  { name:"Gallery III", x:461, y:545, w:461, h:270 }
];

const svg = document.getElementById('floorplan');
svg.insertAdjacentHTML('beforeend', `<path class="wall-outline" d="${wallOutlinePath}"/>`);
rooms.forEach(r => {
  svg.insertAdjacentHTML('beforeend',
    `<rect class="room-rect" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>
     <text class="room-label" x="${r.x+22}" y="${r.y+46}">${r.name.toUpperCase()}</text>`);
});
artworks.forEach(a => {
  svg.insertAdjacentHTML('beforeend',
    `<circle class="dot" cx="${a.x}" cy="${a.y}" r="26" data-id="${a.id}"></circle>
     <text class="dot-number" x="${a.x}" y="${a.y+11}">${a.id}</text>`);
});
svg.querySelectorAll('.dot').forEach(dot => {
  dot.addEventListener('click', () => openSheet(parseInt(dot.dataset.id)));
});

const listContainer = document.getElementById('list-container');
const roomOrder = ["Gallery I","Gallery II","Gallery III"];
roomOrder.forEach(roomName => {
  const items = artworks.filter(a => a.room === roomName);
  const group = document.createElement('div');
  group.className = 'room-group';
  group.innerHTML = `<p class="room-title">${roomName.toUpperCase()}</p>`;
  items.forEach(a => {
    const row = document.createElement('div');
    row.className = 'art-row';
    row.innerHTML = `
      <div class="art-swatch" style="background:${a.hue}"></div>
      <div class="art-info">
        <p class="art-title">${a.title}</p>
        <p class="art-meta">${a.artist}, ${a.year}</p>
      </div>
      <span class="art-arrow">&rsaquo;</span>`;
    row.addEventListener('click', () => openSheet(a.id));
    group.appendChild(row);
  });
  listContainer.appendChild(group);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
  });
});

const scrim = document.getElementById('scrim');
const sheet = document.getElementById('sheet');
const sheetContent = document.getElementById('sheetContent');

function openSheet(id) {
  const a = artworks.find(x => x.id === id);
  if (!a) return;
  sheetContent.innerHTML = `
    <div class="sheet-swatch" style="background:${a.hue}"></div>
    <p class="sheet-title">${a.title}</p>
    <p class="sheet-artist">${a.artist}, ${a.year}</p>
    <div class="sheet-facts">
      <span class="fact-label">Medium</span><span class="fact-value">${a.medium}</span>
      <span class="fact-label">Dimensions</span><span class="fact-value">${a.dims}</span>
      <span class="fact-label">Location</span><span class="fact-value locate" id="locateLink">${a.room} &rsaquo;</span>
    </div>
    <p class="sheet-statement-label">ARTIST STATEMENT</p>
    <p class="sheet-statement">&ldquo;${a.statement}&rdquo;</p>
  `;
  document.getElementById('locateLink').addEventListener('click', () => {
    closeSheet();
    document.querySelector('.tab[data-view="map"]').click();
    setTimeout(() => {
      const dot = svg.querySelector(`.dot[data-id="${a.id}"]`);
      dot.setAttribute('r', '10');
      setTimeout(() => dot.setAttribute('r','7'), 500);
    }, 350);
  });
  scrim.classList.add('open');
  sheet.classList.add('open');
}

function closeSheet() {
  scrim.classList.remove('open');
  sheet.classList.remove('open');
}

scrim.addEventListener('click', closeSheet);
document.getElementById('closeBtn').addEventListener('click', closeSheet);
</script>
</body>
</html>
