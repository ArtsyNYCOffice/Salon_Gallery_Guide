<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meridian Gallery Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1B1B18;
    --ink-soft: #706C63;
    --ink-faint: #9C978C;
    --line: #E3E0D8;
    --accent: #8A6E4B;
    --accent-soft: #EFE9DF;
    --overlay: rgba(27,27,24,0.4);
    --radius-s: 2px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121210; --surface: #181815; --ink: #F1EFE9; --ink-soft: #A8A399;
      --ink-faint: #706C63; --line: #2E2C27; --accent: #C9A876; --accent-soft: #26221A;
      --overlay: rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121210; --surface: #181815; --ink: #F1EFE9; --ink-soft: #A8A399;
    --ink-faint: #706C63; --line: #2E2C27; --accent: #C9A876; --accent-soft: #26221A;
    --overlay: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100vh;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg); overflow: hidden;
  }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ---- City picker ---- */
  .picker-wrap {
    padding: 60px 24px 24px 24px;
    display: flex; flex-direction: column; height: 100%;
  }
  .picker-brand {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    margin: 0 0 6px 0;
  }
  .picker-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
  }
  .picker-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 36px 0;
  }
  .city-list { display: flex; flex-direction: column; gap: 14px; }
  .city-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 20px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s ease;
  }
  .city-card:active { border-color: var(--accent); }
  .city-card-name {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 3px 0;
  }
  .city-card-meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: 0;
  }
  .city-card-arrow { color: var(--accent); font-size: 18px; }

  /* ---- Header ---- */
  header { padding: 22px 20px 0 20px; flex-shrink: 0; }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .gallery-name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .change-location {
    background: none; border: none; font-family: inherit;
    font-size: 12.5px; color: var(--accent); cursor: pointer;
    padding: 0; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .gallery-sub { color: var(--ink-soft); font-size: 13px; margin: 3px 0 18px 0; }
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; font-family: inherit; font-size: 14px;
    color: var(--ink-faint); padding: 0 0 12px 0; cursor: pointer; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--accent);
  }

  /* ---- Content area ---- */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Map view ---- */
  .map-wrap { padding: 18px 20px 40px 20px; }
  .room-caption { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  svg#floorplan { width: 100%; height: auto; display: block; }
  .wall-outline {
    fill: var(--surface); stroke: var(--ink-faint); stroke-width: 7;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .room-rect {
    fill: var(--accent-soft); fill-opacity: 0.55; stroke: var(--accent); stroke-width: 2.5;
  }
  .room-label {
    fill: var(--ink-soft); font-size: 34px; font-family: 'Inter', sans-serif; letter-spacing: 0.04em;
  }
  .dot {
    fill: var(--accent); stroke: var(--bg); stroke-width: 8; cursor: pointer; transition: r 0.15s ease;
  }
  .dot:active { r: 42; }
  .dot-number {
    fill: var(--bg); font-size: 32px; font-weight: 600; text-anchor: middle;
    pointer-events: none; font-family: 'Inter', sans-serif;
  }
  .map-legend {
    margin-top: 18px; font-size: 12px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 8px;
  }
  .map-legend .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

  /* ---- List view ---- */
  .list-wrap { padding: 6px 20px 40px 20px; }
  .room-group { margin-top: 22px; }
  .room-group:first-child { margin-top: 12px; }
  .room-title { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; margin-bottom: 2px; }
  .art-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 0;
    border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .art-swatch { width: 46px; height: 46px; flex-shrink: 0; border-radius: var(--radius-s); }
  .art-info { flex: 1; min-width: 0; }
  .art-title {
    font-size: 14.5px; font-weight: 500; margin: 0 0 2px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .art-meta { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .art-arrow { color: var(--ink-faint); font-size: 15px; flex-shrink: 0; }

  /* ---- Detail sheet ---- */
  .scrim {
    position: absolute; inset: 0; background: var(--overlay); opacity: 0;
    pointer-events: none; transition: opacity 0.25s ease; z-index: 10;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%;
    background: var(--surface); border-radius: 16px 16px 0 0;
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(.25,.8,.35,1);
    z-index: 11; display: flex; flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--line); border-radius: 2px;
    margin: 10px auto 0 auto; flex-shrink: 0;
  }
  .sheet-scroll { overflow-y: auto; padding: 4px 24px 36px 24px; }
  .sheet-swatch { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-s); margin: 16px 0 20px 0; }
  .sheet-title { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px 0; }
  .sheet-artist { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px 0; }
  .sheet-facts {
    display: grid; grid-template-columns: 84px 1fr; row-gap: 8px; font-size: 13px;
    padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  .fact-label { color: var(--ink-faint); }
  .fact-value { color: var(--ink); }
  .fact-value.locate { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .sheet-statement-label { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; margin-bottom: 8px; }
  .sheet-statement {
    font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 16.5px;
    line-height: 1.6; color: var(--ink); margin: 0;
  }
  .close-btn {
    position: absolute; top: 14px; right: 18px; background: var(--accent-soft); color: var(--ink-soft);
    border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1: City picker -->
  <div class="screen active" id="screen-picker">
    <div class="picker-wrap">
      <p class="picker-brand">MERIDIAN GALLERY</p>
      <p class="picker-title">Choose your location</p>
      <p class="picker-sub">Select a gallery to open its visitor guide.</p>
      <div class="city-list" id="cityList"></div>
    </div>
  </div>

  <!-- SCREEN 2: Gallery guide (map / list / detail) -->
  <div class="screen" id="screen-gallery">
    <header>
      <div class="header-top">
        <p class="gallery-name" id="galleryName">Meridian Gallery</p>
        <button class="change-location" id="changeLocationBtn">Change location</button>
      </div>
      <p class="gallery-sub" id="gallerySub">Visitor guide</p>
      <div class="tabs">
        <button class="tab active" data-view="map">Map</button>
        <button class="tab" data-view="list">List</button>
      </div>
    </header>

    <main>
      <div class="view active" id="view-map">
        <div class="map-wrap">
          <p class="room-caption">Tap a marker to view the piece</p>
          <svg id="floorplan" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="map-legend"><span class="swatch"></span> Artwork location</div>
        </div>
      </div>
      <div class="view" id="view-list">
        <div class="list-wrap" id="list-container"></div>
      </div>
    </main>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <button class="close-btn" id="closeBtn">&times;</button>
      <div class="sheet-handle"></div>
      <div class="sheet-scroll" id="sheetContent"></div>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   CITY DATA
   Each city: name, sub (location line), viewBox, wallOutlinePath, rooms[],
   artworks[] with x/y positioned inside that city's own coordinate space.
   ======================================================================= */
const CITIES = {

  // ---- NEW YORK: traced from the real 24th-floor blueprint (exterior walls only) ----
  ny: {
    name: "Meridian Gallery",
    sub: "New York \u00b7 Visitor guide",
    viewBox: "0 0 2222 1297",
    wallOutlinePath: "M 40,72 L 51,410 L 128,412 L 128,494 L 45,495 L 54,749 L 226,751 L 226,913 L 193,914 L 201,957 L 226,962 L 226,1088 L 317,1089 L 318,1257 L 390,1257 L 514,1153 L 903,1153 L 1034,1250 L 1627,1250 L 1756,1147 L 2182,1146 L 2173,684 L 1682,684 L 1681,785 L 1623,784 L 1622,684 L 926,684 L 921,73 L 903,46 L 486,40 L 461,55 L 95,55 L 94,71 Z",
    rooms: [
      { name:"Gallery I",   x:456, y:44,  w:462, h:230 },
      { name:"Gallery II",  x:460, y:275, w:462, h:270 },
      { name:"Gallery III", x:461, y:545, w:461, h:270 }
    ],
    artworks: [
      { id:1, title:"Low Tide", artist:"Renata Solis", year:"2019", medium:"Oil on linen", dims:"120 \u00d7 90 cm", room:"Gallery I", x:530, y:187, hue:"linear-gradient(135deg,#8FA8A0,#3E5C55)",
        statement:"I keep returning to the hour when the water pulls back and leaves everything exposed. This painting isn't about the sea so much as what it uncovers." },
      { id:2, title:"Interior with Two Chairs", artist:"Marcus Feld", year:"2021", medium:"Acrylic on canvas", dims:"100 \u00d7 100 cm", room:"Gallery I", x:687, y:131, hue:"linear-gradient(135deg,#D8C7A1,#A8865A)",
        statement:"A room after an argument, or before one. I wanted the furniture to hold the tension so the people wouldn't have to." },
      { id:3, title:"Study No. 4", artist:"Renata Solis", year:"2018", medium:"Charcoal on paper", dims:"56 \u00d7 76 cm", room:"Gallery I", x:844, y:170, hue:"linear-gradient(135deg,#C9C4BC,#77716A)",
        statement:"A preliminary sketch that outgrew its purpose. Sometimes the study says more plainly what the finished piece is trying to say." },
      { id:4, title:"Static Bloom", artist:"Iris Whitfield", year:"2022", medium:"Mixed media on board", dims:"80 \u00d7 80 cm", room:"Gallery II", x:534, y:442, hue:"linear-gradient(135deg,#C97B63,#7A3B2E)",
        statement:"Flowers caught mid-decay, rendered with the same care usually reserved for their prime. Decline has its own kind of symmetry." },
      { id:5, title:"Untitled (Corridor)", artist:"Marcus Feld", year:"2020", medium:"Oil on canvas", dims:"140 \u00d7 100 cm", room:"Gallery II", x:691, y:378, hue:"linear-gradient(135deg,#8A8FA8,#4A4E66)",
        statement:"A hallway I walked through for years without seeing it. This is my attempt to finally look." },
      { id:6, title:"Ledger", artist:"Iris Whitfield", year:"2023", medium:"Ink and gold leaf on paper", dims:"45 \u00d7 60 cm", room:"Gallery II", x:848, y:424, hue:"linear-gradient(135deg,#D9C77A,#8A7220)",
        statement:"A record of small debts \u2014 favors owed, apologies unmade. The gold leaf marks the ones I never settled." },
      { id:7, title:"Coastal Fragment I", artist:"Dana Okafor", year:"2017", medium:"Bronze", dims:"38 cm height", room:"Gallery III", x:535, y:712, hue:"linear-gradient(135deg,#A89A7C,#5C5240)",
        statement:"Cast from a piece of driftwood I couldn't bring myself to burn. The bronze keeps its shape long after the wood would have given out." },
      { id:8, title:"Coastal Fragment II", artist:"Dana Okafor", year:"2017", medium:"Bronze", dims:"41 cm height", room:"Gallery III", x:692, y:648, hue:"linear-gradient(135deg,#9C9184,#4E463B)",
        statement:"The companion piece. I made these as a pair because the first felt unfinished on its own \u2014 like half a sentence." },
      { id:9, title:"Late Correspondence", artist:"Renata Solis", year:"2023", medium:"Oil on linen", dims:"150 \u00d7 110 cm", room:"Gallery III", x:848, y:694, hue:"linear-gradient(135deg,#B5876B,#623F2A)",
        statement:"Painted from a box of letters my grandmother never sent. I don't know what they said. I only know the color of the paper had faded to this." }
    ]
  },

  // ---- LONDON: placeholder floor plan (no blueprint supplied yet) ----
  london: {
    name: "Meridian Gallery",
    sub: "London \u00b7 Visitor guide",
    viewBox: "0 0 900 520",
    wallOutlinePath: "M 40,40 L 860,40 L 860,480 L 480,480 L 480,520 L 420,520 L 420,480 L 40,480 Z",
    rooms: [
      { name:"Gallery I",   x:70,  y:70, w:230, h:380 },
      { name:"Gallery II",  x:335, y:70, w:230, h:380 },
      { name:"Gallery III", x:600, y:70, w:230, h:380 }
    ],
    artworks: [
      { id:1, title:"Thames Fog", artist:"Imogen Cole", year:"2021", medium:"Watercolor on paper", dims:"38 \u00d7 56 cm", room:"Gallery I", x:135, y:160, hue:"linear-gradient(135deg,#9FB0B8,#4C5E66)",
        statement:"The river disappears a little more every winter. I paint it before I can be sure what I'm remembering and what I'm inventing." },
      { id:2, title:"Underground", artist:"Declan Ryle", year:"2021", medium:"Charcoal on paper", dims:"50 \u00d7 65 cm", room:"Gallery I", x:185, y:300, hue:"linear-gradient(135deg,#8A8680,#403D38)",
        statement:"Everyone on the platform is alone in exactly the same way. I wanted the charcoal to feel like the dust of the tunnels itself." },
      { id:3, title:"Terraced", artist:"Priya Anand", year:"2022", medium:"Oil on board", dims:"45 \u00d7 60 cm", room:"Gallery I", x:235, y:230, hue:"linear-gradient(135deg,#C9A6A0,#7A4A44)",
        statement:"Every house on the street is identical and every garden behind it is not. This is a painting about the gardens." },
      { id:4, title:"Borough Market, Dawn", artist:"Priya Anand", year:"2019", medium:"Oil on canvas", dims:"70 \u00d7 90 cm", room:"Gallery II", x:400, y:170, hue:"linear-gradient(135deg,#C9B07A,#73591F)",
        statement:"Before the crowds, the market belongs to the people who built it that morning. I go back for that hour and nothing else." },
      { id:5, title:"Still Life with Kettle", artist:"Felicity Nkemelu", year:"2022", medium:"Oil on linen", dims:"40 \u00d7 40 cm", room:"Gallery II", x:450, y:300, hue:"linear-gradient(135deg,#B9C9B0,#51613F)",
        statement:"My grandmother's kettle, painted the week after the funeral. It was the only object in the kitchen I could bear to look at directly." },
      { id:6, title:"Umbrella Weather", artist:"Imogen Cole", year:"2023", medium:"Gouache on paper", dims:"30 \u00d7 42 cm", room:"Gallery II", x:500, y:230, hue:"linear-gradient(135deg,#8CA0C9,#2F3F61)",
        statement:"Londoners apologize to their umbrellas the way other people apologize to their cars. This is an affectionate painting about bad weather." },
      { id:7, title:"Rooftops, Hackney", artist:"Felicity Nkemelu", year:"2023", medium:"Acrylic on canvas", dims:"60 \u00d7 80 cm", room:"Gallery III", x:665, y:160, hue:"linear-gradient(135deg,#C9988A,#6B392C)",
        statement:"From my studio window the roofline looks like a single long animal. I've been painting its spine for three years now." },
      { id:8, title:"The Long Commute", artist:"Imogen Cole", year:"2024", medium:"Mixed media", dims:"50 \u00d7 70 cm", room:"Gallery III", x:715, y:300, hue:"linear-gradient(135deg,#A8A8C9,#454566)",
        statement:"An hour each way, five days a week, for eleven years. This is built from the actual tickets I kept without knowing why." },
      { id:9, title:"Night Bus", artist:"Declan Ryle", year:"2020", medium:"Acrylic on canvas", dims:"55 \u00d7 75 cm", room:"Gallery III", x:765, y:230, hue:"linear-gradient(135deg,#7A7FA0,#2C2E42)",
        statement:"The top deck at 2am holds a very specific kind of company. Strangers, briefly, taking care not to look at one another." }
    ]
  },

  // ---- BERLIN: placeholder floor plan (no blueprint supplied yet) ----
  berlin: {
    name: "Meridian Gallery",
    sub: "Berlin \u00b7 Visitor guide",
    viewBox: "0 0 520 900",
    wallOutlinePath: "M 40,40 L 480,40 L 480,860 L 180,860 L 180,820 L 40,820 Z",
    rooms: [
      { name:"Gallery I",   x:70, y:70,  w:380, h:230 },
      { name:"Gallery II",  x:70, y:330, w:380, h:230 },
      { name:"Gallery III", x:70, y:590, w:380, h:200 }
    ],
    artworks: [
      { id:1, title:"Grau", artist:"Lena Brandt", year:"2020", medium:"Oil on canvas", dims:"80 \u00d7 100 cm", room:"Gallery I", x:150, y:140, hue:"linear-gradient(135deg,#A8A8A4,#4A4A46)",
        statement:"Grey is not the absence of color here, it's the color Berlin actually is for six months of the year. I stopped fighting it." },
      { id:2, title:"U-Bahn Study", artist:"Lena Brandt", year:"2019", medium:"Charcoal on paper", dims:"40 \u00d7 55 cm", room:"Gallery I", x:300, y:190, hue:"linear-gradient(135deg,#8F8A82,#38342E)",
        statement:"Drawn in the time between two stops, over and over, until the gesture became faster than the train." },
      { id:3, title:"Mauerreste", artist:"Tobias Hahn", year:"2018", medium:"Photography", dims:"50 \u00d7 70 cm", room:"Gallery I", x:390, y:140, hue:"linear-gradient(135deg,#B0987A,#5C4A32)",
        statement:"A fragment of the Wall, now load-bearing for a parking structure. I photograph what history gets repurposed into." },
      { id:4, title:"Plattenbau", artist:"Katharina Voss", year:"2021", medium:"Ink on paper", dims:"35 \u00d7 50 cm", room:"Gallery II", x:150, y:400, hue:"linear-gradient(135deg,#9FAEB5,#3E4D54)",
        statement:"The prefabricated blocks get mocked and then get loved, usually by the same people. I drew mine from the balcony I grew up on." },
      { id:5, title:"Kreuzberg Interior", artist:"Katharina Voss", year:"2020", medium:"Oil on board", dims:"60 \u00d7 80 cm", room:"Gallery II", x:300, y:450, hue:"linear-gradient(135deg,#C9A880,#73541F)",
        statement:"A kitchen table that's hosted four different roommates' worth of arguments and reconciliations. The table doesn't change; we do." },
      { id:6, title:"Spree at Night", artist:"Lena Brandt", year:"2022", medium:"Acrylic on canvas", dims:"70 \u00d7 90 cm", room:"Gallery II", x:390, y:400, hue:"linear-gradient(135deg,#6E8CA0,#263540)",
        statement:"The river at 3am belongs to the people still deciding whether the night is over. I used to be one of them." },
      { id:7, title:"Tempelhof", artist:"Tobias Hahn", year:"2023", medium:"Photography", dims:"60 \u00d7 90 cm", room:"Gallery III", x:150, y:650, hue:"linear-gradient(135deg,#C9C4A0,#6B6538)",
        statement:"An airfield with no planes left, just kites and cyclists and a runway slowly being reclaimed by weeds. I go back every summer." },
      { id:8, title:"Fernsehturm", artist:"Tobias Hahn", year:"2022", medium:"Photography", dims:"50 \u00d7 70 cm", room:"Gallery III", x:300, y:700, hue:"linear-gradient(135deg,#A090A8,#453048)",
        statement:"Visible from nearly everywhere in the city whether you want to see it or not, which felt like the whole point." },
      { id:9, title:"Still Life, Prenzlauer Berg", artist:"Katharina Voss", year:"2024", medium:"Oil on linen", dims:"40 \u00d7 40 cm", room:"Gallery III", x:390, y:650, hue:"linear-gradient(135deg,#B5A88F,#5C4F38)",
        statement:"Coffee, a half-eaten pastry, a stroller parked just out of frame. The whole neighborhood fits in this one table, somehow." }
    ]
  }
};

const CITY_ORDER = ["ny", "london", "berlin"];
const CITY_LABELS = { ny: "New York", london: "London", berlin: "Berlin" };

let activeCity = null;

/* ---------- City picker ---------- */
const cityList = document.getElementById('cityList');
CITY_ORDER.forEach(key => {
  const city = CITIES[key];
  const card = document.createElement('button');
  card.className = 'city-card';
  card.innerHTML = `
    <span>
      <p class="city-card-name">${CITY_LABELS[key]}</p>
      <p class="city-card-meta">${city.rooms.length} galleries \u00b7 ${city.artworks.length} works on view</p>
    </span>
    <span class="city-card-arrow">&rsaquo;</span>`;
  card.addEventListener('click', () => openCity(key));
  cityList.appendChild(card);
});

function openCity(key) {
  activeCity = CITIES[key];
  document.getElementById('galleryName').textContent = activeCity.name;
  document.getElementById('gallerySub').textContent = activeCity.sub;
  renderMap(activeCity);
  renderList(activeCity);
  // reset to map tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-view="map"]').classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-map').classList.add('active');

  document.getElementById('screen-picker').classList.remove('active');
  document.getElementById('screen-gallery').classList.add('active');
}

document.getElementById('changeLocationBtn').addEventListener('click', () => {
  closeSheet();
  document.getElementById('screen-gallery').classList.remove('active');
  document.getElementById('screen-picker').classList.add('active');
});

/* ---------- Map rendering ---------- */
const svg = document.getElementById('floorplan');

function renderMap(city) {
  svg.setAttribute('viewBox', city.viewBox);
  svg.innerHTML = '';
  svg.insertAdjacentHTML('beforeend', `<path class="wall-outline" d="${city.wallOutlinePath}"/>`);
  city.rooms.forEach(r => {
    svg.insertAdjacentHTML('beforeend',
      `<rect class="room-rect" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>
       <text class="room-label" x="${r.x+22}" y="${r.y+46}">${r.name.toUpperCase()}</text>`);
  });
  city.artworks.forEach(a => {
    svg.insertAdjacentHTML('beforeend',
      `<circle class="dot" cx="${a.x}" cy="${a.y}" r="26" data-id="${a.id}"></circle>
       <text class="dot-number" x="${a.x}" y="${a.y+11}">${a.id}</text>`);
  });
  svg.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => openSheet(parseInt(dot.dataset.id)));
  });
}

/* ---------- List rendering ---------- */
const listContainer = document.getElementById('list-container');

function renderList(city) {
  listContainer.innerHTML = '';
  city.rooms.forEach(r => {
    const items = city.artworks.filter(a => a.room === r.name);
    if (!items.length) return;
    const group = document.createElement('div');
    group.className = 'room-group';
    group.innerHTML = `<p class="room-title">${r.name.toUpperCase()}</p>`;
    items.forEach(a => {
      const row = document.createElement('div');
      row.className = 'art-row';
      row.innerHTML = `
        <div class="art-swatch" style="background:${a.hue}"></div>
        <div class="art-info">
          <p class="art-title">${a.title}</p>
          <p class="art-meta">${a.artist}, ${a.year}</p>
        </div>
        <span class="art-arrow">&rsaquo;</span>`;
      row.addEventListener('click', () => openSheet(a.id));
      group.appendChild(row);
    });
    listContainer.appendChild(group);
  });
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
  });
});

/* ---------- Detail sheet ---------- */
const scrim = document.getElementById('scrim');
const sheet = document.getElementById('sheet');
const sheetContent = document.getElementById('sheetContent');

function openSheet(id) {
  if (!activeCity) return;
  const a = activeCity.artworks.find(x => x.id === id);
  if (!a) return;
  sheetContent.innerHTML = `
    <div class="sheet-swatch" style="background:${a.hue}"></div>
    <p class="sheet-title">${a.title}</p>
    <p class="sheet-artist">${a.artist}, ${a.year}</p>
    <div class="sheet-facts">
      <span class="fact-label">Medium</span><span class="fact-value">${a.medium}</span>
      <span class="fact-label">Dimensions</span><span class="fact-value">${a.dims}</span>
      <span class="fact-label">Location</span><span class="fact-value locate" id="locateLink">${a.room} &rsaquo;</span>
    </div>
    <p class="sheet-statement-label">ARTIST STATEMENT</p>
    <p class="sheet-statement">&ldquo;${a.statement}&rdquo;</p>
  `;
  document.getElementById('locateLink').addEventListener('click', () => {
    closeSheet();
    document.querySelector('.tab[data-view="map"]').click();
    setTimeout(() => {
      const dot = svg.querySelector(`.dot[data-id="${a.id}"]`);
      if (!dot) return;
      dot.setAttribute('r', '42');
      setTimeout(() => dot.setAttribute('r','26'), 500);
    }, 350);
  });
  scrim.classList.add('open');
  sheet.classList.add('open');
}

function closeSheet() {
  scrim.classList.remove('open');
  sheet.classList.remove('open');
}

scrim.addEventListener('click', closeSheet);
document.getElementById('closeBtn').addEventListener('click', closeSheet);
</script>
</body>
</html>
