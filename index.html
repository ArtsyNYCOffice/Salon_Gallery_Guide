<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Art Salon Guide - 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1B1B18;
    --ink-soft: #706C63;
    --ink-faint: #9C978C;
    --line: #E3E0D8;
    --accent: #8A6E4B;
    --accent-soft: #EFE9DF;
    --overlay: rgba(27,27,24,0.4);
    --radius-s: 2px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121210; --surface: #181815; --ink: #F1EFE9; --ink-soft: #A8A399;
      --ink-faint: #706C63; --line: #2E2C27; --accent: #C9A876; --accent-soft: #26221A;
      --overlay: rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121210; --surface: #181815; --ink: #F1EFE9; --ink-soft: #A8A399;
    --ink-faint: #706C63; --line: #2E2C27; --accent: #C9A876; --accent-soft: #26221A;
    --overlay: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100vh;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg); overflow: hidden;
  }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ---- City picker ---- */
  .picker-wrap {
    padding: 60px 24px 24px 24px;
    display: flex; flex-direction: column; height: 100%;
  }
  .picker-brand {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    margin: 0 0 6px 0;
  }
  .picker-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
  }
  .picker-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 36px 0;
  }
  .city-list { display: flex; flex-direction: column; gap: 14px; }
  .city-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 20px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s ease;
  }
  .city-card:active { border-color: var(--accent); }
  .city-card-name {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 3px 0;
  }
  .city-card-meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: 0;
  }
  .city-card-arrow { color: var(--accent); font-size: 18px; }

  /* ---- Header ---- */
  header { padding: 22px 20px 0 20px; flex-shrink: 0; }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .gallery-name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .change-location {
    background: none; border: none; font-family: inherit;
    font-size: 12.5px; color: var(--accent); cursor: pointer;
    padding: 0; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .gallery-sub { color: var(--ink-soft); font-size: 13px; margin: 3px 0 18px 0; }
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; font-family: inherit; font-size: 14px;
    color: var(--ink-faint); padding: 0 0 12px 0; cursor: pointer; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--accent);
  }

  /* ---- Content area ---- */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Map view ---- */
  .map-wrap { padding: 18px 20px 40px 20px; }
  .room-caption { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  svg#floorplan { width: 100%; height: auto; display: block; }
  .wall-outline {
    fill: var(--surface); stroke: var(--ink-faint); stroke-width: 7;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .room-rect {
    fill: var(--accent-soft); fill-opacity: 0.55; stroke: var(--accent); stroke-width: 2.5;
  }
  .room-label {
    fill: var(--ink-soft); font-size: 34px; font-family: 'Inter', sans-serif; letter-spacing: 0.04em;
  }
  .dot {
    fill: var(--accent); stroke: var(--bg); stroke-width: 8; cursor: pointer; transition: r 0.15s ease;
  }
  .dot:active { r: 42; }
  .dot-number {
    fill: var(--bg); font-size: 32px; font-weight: 600; text-anchor: middle;
    pointer-events: none; font-family: 'Inter', sans-serif;
  }
  .map-legend {
    margin-top: 18px; font-size: 12px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 8px;
  }
  .map-legend .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

  /* ---- List view ---- */
  .list-wrap { padding: 6px 20px 40px 20px; }
  .room-group { margin-top: 22px; }
  .room-group:first-child { margin-top: 12px; }
  .room-title { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; margin-bottom: 2px; }
  .art-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 0;
    border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .art-swatch { width: 46px; height: 46px; flex-shrink: 0; border-radius: var(--radius-s); }
  .art-info { flex: 1; min-width: 0; }
  .art-title {
    font-size: 14.5px; font-weight: 500; margin: 0 0 2px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .art-meta { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .art-arrow { color: var(--ink-faint); font-size: 15px; flex-shrink: 0; }

  /* ---- Detail sheet ---- */
  .scrim {
    position: absolute; inset: 0; background: var(--overlay); opacity: 0;
    pointer-events: none; transition: opacity 0.25s ease; z-index: 10;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%;
    background: var(--surface); border-radius: 16px 16px 0 0;
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(.25,.8,.35,1);
    z-index: 11; display: flex; flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--line); border-radius: 2px;
    margin: 10px auto 0 auto; flex-shrink: 0;
  }
  .sheet-scroll { overflow-y: auto; padding: 4px 24px 36px 24px; }
  .sheet-swatch { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-s); margin: 16px 0 20px 0; }
  .sheet-title { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px 0; }
  .sheet-artist { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px 0; }
  .sheet-facts {
    display: grid; grid-template-columns: 84px 1fr; row-gap: 8px; font-size: 13px;
    padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  .fact-label { color: var(--ink-faint); }
  .fact-value { color: var(--ink); }
  .fact-value.locate { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .sheet-statement-label { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.04em; margin-bottom: 8px; }
  .sheet-statement {
    font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 16.5px;
    line-height: 1.6; color: var(--ink); margin: 0;
  }
  .sheet-note {
    font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5;
    color: var(--ink-soft); margin: 0;
  }
  .close-btn {
    position: absolute; top: 14px; right: 18px; background: var(--accent-soft); color: var(--ink-soft);
    border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1: City picker -->
  <div class="screen active" id="screen-picker">
    <div class="picker-wrap">
      <p class="picker-brand">ART SALON GUIDE &mdash; 2026</p>
      <p class="picker-title">Choose your location</p>
      <p class="picker-sub">Select a gallery to open its visitor guide.</p>
      <div class="city-list" id="cityList"></div>
    </div>
  </div>

  <!-- SCREEN 2: Gallery guide (map / list / detail) -->
  <div class="screen" id="screen-gallery">
    <header>
      <div class="header-top">
        <p class="gallery-name" id="galleryName">Art Salon Guide &mdash; 2026</p>
        <button class="change-location" id="changeLocationBtn">Change location</button>
      </div>
      <p class="gallery-sub" id="gallerySub">Visitor guide</p>
      <div class="tabs">
        <button class="tab active" data-view="map">Map</button>
        <button class="tab" data-view="list">List</button>
      </div>
    </header>

    <main>
      <div class="view active" id="view-map">
        <div class="map-wrap">
          <p class="room-caption">Tap a marker to view the piece</p>
          <svg id="floorplan" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="map-legend"><span class="swatch"></span> Artwork location</div>
        </div>
      </div>
      <div class="view" id="view-list">
        <div class="list-wrap" id="list-container"></div>
      </div>
    </main>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <button class="close-btn" id="closeBtn">&times;</button>
      <div class="sheet-handle"></div>
      <div class="sheet-scroll" id="sheetContent"></div>
    </div>
  </div>

</div>

  // ---- NEW YORK: traced from the real 24th-floor blueprint (exterior walls only) ----
  ny: {
    name: "Art Salon Guide \u2014 2026",

    wallOutlinePath: "M 40,72 L 51,410 L 128,412 L 128,494 L 45,495 L 54,749 L 226,751 L 226,913 L 193,914 L 201,957 L 226,962 L 226,1088 L 317,1089 L 318,1257 L 390,1257 L 514,1153 L 903,1153 L 1034,1250 L 1627,1250 L 1756,1147 L 2182,1146 L 2173,684 L 1682,684 L 1681,785 L 1623,784 L 1622,684 L 926,684 L 921,73 L 903,46 L 486,40 L 461,55 L 95,55 L 94,71 Z",

    artworks: [
      { id:1, title:"Motivation", artist:"Alana Heiss", year:"2021", medium:"Digital illustration", dims:"", x:573, y:240, hue:"linear-gradient(135deg,#8CA0C9,#2F3F61)",
        statement:"The artist picked up running and smoking during the pandemic, and quit one not too long after. (Running is a nightmare.)" },
      { id:2, title:"Friendship", artist:"Alana Heiss", year:"2017", medium:"Digital illustration", dims:"", x:903, y:790, hue:"linear-gradient(135deg,#B9C9B0,#51613F)",
        statement:"The artist reanimates a familiar lyric fragment\u2014an address to \u201cdarkness\u201d as intimate confidant\u2014and stages its rupture through a deadpan telephonic exchange. What begins as an invocation of shared interiority collapses into refusal: darkness, personified, disavows the very relation the speaker presumes. Rendered in the unassuming register of a doodled joke, the piece nonetheless stages a quiet crisis of address: what does it mean to reach for solace and be met, instead, with suspicion? Here, intimacy is revealed as a one-way transmission, and the old friend, it turns out, was never listening." },
      { id:3, title:"Shoes", artist:"Alana Heiss", year:"2021", medium:"Digital illustration", dims:"", x:1783, y:1010, hue:"linear-gradient(135deg,#9FB0B8,#4C5E66)",
        statement:"if you\ncan't draw\ntry anyway" },
      { id:4, title:"Sweet Birthday Baby Crown", artist:"Allie & Jodi Bohr", year:"2026", medium:"Hand-embroidered craft felt with cotton embroidery floss and floral ribbon closure", dims:"", x:1123, y:790, hue:"linear-gradient(135deg,#C9988A,#6B392C)",
        statement:"Made for the artist's daughter in honor of her first birthday. The garden motif uses French knot, back, chain, satin, and woven rose stitches, and the artist's mother finished it with a blanket-stitched edge due to \u201cparty business.\u201d The garden theme reflects what gardens imply: that growth is beautiful, and that change is something to celebrate. The crown is designed to be evergreen. Each year's number attaches by a button to a loop sewn into the front. So really, the crown is never truly finished as it grows and changes with the wearer." },
      { id:5, title:"Evidence Based", artist:"Blake Lucius Griffey", year:"2026", medium:"Short film (still)", dims:"Running time 8:45", x:243, y:240, hue:"linear-gradient(135deg,#9C9184,#4E463B)" },
      { id:6, title:"Untitled", artist:"Camille Weisgant", year:"circa 1998, 2026", medium:"Fiber art; ceramic", dims:"8 \u00d7 8 in and 3 \u00d7 3 in", x:573, y:1010, hue:"linear-gradient(135deg,#A89A7C,#5C5240)",
        statement:"My mother recently moved across the country, back to where I grew up. Ahead of her move, I helped her clear out an old storage space, where we found much of my childhood memorabilia. It was an exhausting process both physically and emotionally. We got rid of most things, but I kept a few I particularly liked or remembered. One was this wall hanging, which I decided to pair with something from my current ceramic practice. Right now, I\u2019m working on jars in the studio, making sure lids fit, and don\u2019t stick in firing. The jar holds a locket I wore as a child." },
      { id:7, title:"I remember you came to my house in the rain / Stood on the front porch / Told me you were sorry", artist:"Chelsie Sunde", year:"2026", medium:"Oil on paper mounted on panel", dims:"12 \u00d7 16 in", x:1233, y:1120, hue:"linear-gradient(135deg,#8FA8A0,#3E5C55)" },
      { id:8, title:"Untitled", artist:"David Meehan", year:"2026", medium:"Photography", dims:"11 \u00d7 14 in", x:1453, y:790, hue:"linear-gradient(135deg,#8A8FA8,#4A4E66)" },
      { id:9, title:"Container I", artist:"Georgieanna Richer", year:"2026", medium:"Oil on canvas", dims:"40 \u00d7 36 in", x:353, y:350, hue:"linear-gradient(135deg,#A8A8A4,#4A4A46)",
        statement:"Painting." },
      { id:10, title:"Death Garden", artist:"Jenn Cort\u00e9s", year:"2025", medium:"Acrylic on canvas paper", dims:"2.5 \u00d7 2.5 in", x:463, y:900, hue:"linear-gradient(135deg,#C9A6A0,#7A4A44)",
        statement:"Death Gardens are an ongoing series of miniature paintings depicting human skulls being reclaimed by lush flowery fields." },
      { id:11, title:"Avva and Chinnakalai", artist:"Joann Kielar, Abhiti Prabahar & Langston MacDiarmid", year:"2025", medium:"Fabric", dims:"1 \u00d7 1 ft", x:353, y:790, hue:"linear-gradient(135deg,#D9A87A,#8A5A20)",
        statement:"These puppets are inspired by my Avva (grandma) and her watchman in India. Avva is now 101 years old and her watchman is in his 70s (we think). I've always been amused by Chinnakalai, whose name means \u201csmall cow.\u201d His lackluster work performance is a perpetual source of frustration for my parents, but he\u2019s famous to the rest of my family for his striking features and incredible head of hair. We\u2019ve taken to calling him my Avva\u2019s \u201cboyfriend\u201d because she gets so much enjoyment from the company and conversation he provides her. If someone were to break into the house, my grandma would probably handle it while he continued resting on the porch.\n\nMy Mother-in-Law is a puppeteer, and over last year\u2019s holiday break I asked her if we could make puppets for my one-year-old nephew. We started on the last day of our visit and stayed up late into the night finishing them. About halfway through, as my husband started carving tiny ears out of a chopstick and my MIL started making a tiny saree out of saree scraps, I realized how much work it takes to make puppets. That\u2019s when I decided that I couldn\u2019t give them to my nephew and had to keep them forever." },
      { id:12, title:"Untitled (Family Portrait)", artist:"Kate Hyman", year:"2018\u201319", medium:"Oil on canvas board", dims:"16 \u00d7 20 in", x:463, y:460, hue:"linear-gradient(135deg,#8A8680,#403D38)" },

      { id:16, title:"Mini", artist:"Mini (facilitated by Jason Rulnick)", year:"2026", medium:"Tempera on paper", dims:"3 works, 14 \u00d7 18 in each (approx. 48 \u00d7 18 in overall)", x:683, y:680, hue:"linear-gradient(135deg,#D9C77A,#8A7220)",
        note:"Hanging instructions: group of 3 works, stacked vertically with a few inches between each. Tacked to the wall at the upper corners in the style of refrigerator magnets." },
      { id:17, title:"stoop notes", artist:"Molly Moran", year:"", medium:"Writing / digital media", dims:"Physical poster, 8.5 \u00d7 11 in, with QR code", x:243, y:570, hue:"linear-gradient(135deg,#C9A880,#73541F)",
        statement:"stoop notes is an arts, culture, & creative writing newsletter housed on Substack and rooted in Brooklyn. The name comes from the title of my first short story collection, From the Stoop, which was deeply inspired by family oral history of life in South Brooklyn in the 1970s and \u201980s. I started stoop notes in 2025 as an expansion of that project; a digital space for exploring loose threads and hybrid forms, grounded in a sense of place. In its current form, it comprises poetry, essays, and a visual diary. At its core, stoop notes is practice built on loving, listening, & close-looking." },

      { id:1, title:"Pancakes the Frog", artist:"Amy Monkhouse", year:"2026", medium:"Crochet (cotton yarn)", dims:"15 \u00d7 30 cm", x:241, y:243, hue:"linear-gradient(135deg,#A8A8C9,#454566)",
        statement:"I started crocheting 2 years ago but always gave away my projects once they were done. I decided to finally make something for myself. Pattern is by Yan Schenkel, and the name \u201cPancakes\u201d was bestowed upon him by Matt Jones." },
      { id:2, title:"Strange Worship", artist:"Angela Vinci", year:"2026", medium:"Encaustic mixed media", dims:"3 panels, 25 \u00d7 25 cm each", x:2661, y:1013, hue:"linear-gradient(135deg,#C9A876,#73541F)",
        statement:"With increasing unrest and uncertainty people often turn to religion or other structural systems, seeking comfort through ritual and prescribed rules. In looking through religious artwork, especially from the Renaissance (another period of major upheaval) the human body is often portrayed in what we would today consider scandalous. This piece is an exploration of this schism of religion as a controlling force, often using shame especially around nudity, with the reverence our society has for artwork from \u201cold masters\u201d and current weaponization of nostalgia, twisting familiar images and embellishing them with (false) gold to represent our other modern obsession of acquisitive, but empty wealth." },
      { id:3, title:"Novos Londrinos (self-titled album)", artist:"Cl\u00e1udia Marques (Novos Londrinos)", year:"2026", medium:"Sound", dims:"", x:1341, y:1013, hue:"linear-gradient(135deg,#8A8FA8,#4A4E66)",
        statement:"Our debut EP featuring my vocals, recorded at the legendary Abbey Road Studios. Six original songs, written by the three of us (myself, guitarist and drummer) and brought to life with more than 20 collaborators across music, production, mastering, design and photography. Stream it free on your favourite platform, or head to Bandcamp to learn more and get your copy." },
      { id:4, title:"Untitled", artist:"Isobelle Boltt", year:"2026", medium:"Willow", dims:"\u2300 20 cm", x:2001, y:243, hue:"linear-gradient(135deg,#B5A88F,#5C4F38)",
        statement:"On my honeymoon in Finland and Estonia, I fell (even more) in love with hand-crafted baskets, which seemed to be everywhere I looked. Over there, they\u2019re often made with planed birch wood. In England, we have a long tradition of weaving with willow, so upon my return I booked a willow-weaving course to try my hand at it. It was an engaging and meditative experience, and I\u2019m so proud of my wonky but beautiful basket." },

const CITY_ORDER = ["ny", "london", "berlin"];
const CITY_LABELS = { ny: "New York", london: "London", berlin: "Berlin" };

let activeCity = null;

/* ---------- City picker ---------- */
const cityList = document.getElementById('cityList');
CITY_ORDER.forEach(key => {
  const city = CITIES[key];
  const card = document.createElement('button');
  card.className = 'city-card';
  const metaText = city.rooms.length
    ? `${city.rooms.length} galleries \u00b7 ${city.artworks.length} works on view`
    : `${city.artworks.length} works on view`;
  card.innerHTML = `
    <span>
      <p class="city-card-name">${CITY_LABELS[key]}</p>
      <p class="city-card-meta">${metaText}</p>
    </span>
    <span class="city-card-arrow">&rsaquo;</span>`;
  card.addEventListener('click', () => openCity(key));
  cityList.appendChild(card);
});

function openCity(key) {
  activeCity = CITIES[key];
  document.getElementById('galleryName').textContent = activeCity.name;
  document.getElementById('gallerySub').textContent = activeCity.sub;
  renderMap(activeCity);
  renderList(activeCity);
  // reset to map tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-view="map"]').classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-map').classList.add('active');

  document.getElementById('screen-picker').classList.remove('active');
  document.getElementById('screen-gallery').classList.add('active');
}

document.getElementById('changeLocationBtn').addEventListener('click', () => {
  closeSheet();
  document.getElementById('screen-gallery').classList.remove('active');
  document.getElementById('screen-picker').classList.add('active');
});

/* ---------- Map rendering ---------- */
const svg = document.getElementById('floorplan');

function renderMap(city) {
  svg.setAttribute('viewBox', city.viewBox);
  svg.innerHTML = '';
  svg.insertAdjacentHTML('beforeend', `<path class="wall-outline" d="${city.wallOutlinePath}"/>`);
  city.rooms.forEach(r => {
    svg.insertAdjacentHTML('beforeend',
      `<rect class="room-rect" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>
       <text class="room-label" x="${r.x+22}" y="${r.y+46}">${r.name.toUpperCase()}</text>`);
  });
  city.artworks.forEach(a => {
    svg.insertAdjacentHTML('beforeend',
      `<circle class="dot" cx="${a.x}" cy="${a.y}" r="26" data-id="${a.id}"></circle>
       <text class="dot-number" x="${a.x}" y="${a.y+11}">${a.id}</text>`);
  });
  svg.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => openSheet(parseInt(dot.dataset.id)));
  });
}

/* ---------- List rendering ---------- */
const listContainer = document.getElementById('list-container');

function renderList(city) {
  listContainer.innerHTML = '';

  function buildRow(a) {
    const row = document.createElement('div');
    row.className = 'art-row';
    row.innerHTML = `
      <div class="art-swatch" style="background:${a.hue}"></div>
      <div class="art-info">
        <p class="art-title">No. ${a.id} \u2014 ${a.title}</p>
        <p class="art-meta">${a.year ? a.artist + ', ' + a.year : a.artist}</p>
      </div>
      <span class="art-arrow">&rsaquo;</span>`;
    row.addEventListener('click', () => openSheet(a.id));
    return row;
  }

  if (!city.rooms.length) {
    // No named room zones for this city: flat list, in id order
    // (ids are assigned alphabetically by artist first name).
    const group = document.createElement('div');
    group.className = 'room-group';
    [...city.artworks].sort((a,b) => a.id - b.id).forEach(a => group.appendChild(buildRow(a)));
    listContainer.appendChild(group);
    return;
  }

  city.rooms.forEach(r => {
    const items = city.artworks.filter(a => a.room === r.name).sort((a,b) => a.id - b.id);
    if (!items.length) return;
    const group = document.createElement('div');
    group.className = 'room-group';
    group.innerHTML = `<p class="room-title">${r.name.toUpperCase()}</p>`;
    items.forEach(a => group.appendChild(buildRow(a)));
    listContainer.appendChild(group);
  });
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
  });
});

/* ---------- Detail sheet ---------- */
const scrim = document.getElementById('scrim');
const sheet = document.getElementById('sheet');
const sheetContent = document.getElementById('sheetContent');

function openSheet(id) {
  if (!activeCity) return;
  const a = activeCity.artworks.find(x => x.id === id);
  if (!a) return;
  const locationText = a.room ? a.room : `Work No. ${a.id}`;
  const artistLine = a.year ? `${a.artist}, ${a.year}` : a.artist;

  let factsRows = `<span class="fact-label">Medium</span><span class="fact-value">${a.medium}</span>`;
  if (a.dims) {
    factsRows += `<span class="fact-label">Dimensions</span><span class="fact-value">${a.dims}</span>`;
  }
  factsRows += `<span class="fact-label">Location</span><span class="fact-value locate" id="locateLink">${locationText} &rsaquo;</span>`;

  const statementHtml = a.statement
    ? `<p class="sheet-statement-label">ARTIST STATEMENT</p><p class="sheet-statement">&ldquo;${a.statement.replace(/\n/g,'<br><br>')}&rdquo;</p>`
    : '';
  const noteHtml = a.note
    ? `<p class="sheet-statement-label" style="margin-top:${a.statement ? '20px' : '0'}">NOTE</p><p class="sheet-note">${a.note}</p>`
    : '';

  sheetContent.innerHTML = `
    <div class="sheet-swatch" style="background:${a.hue}"></div>
    <p class="sheet-title">No. ${a.id} \u2014 ${a.title}</p>
    <p class="sheet-artist">${artistLine}</p>
    <div class="sheet-facts">${factsRows}</div>
    ${statementHtml}
    ${noteHtml}
  `;
  document.getElementById('locateLink').addEventListener('click', () => {
    closeSheet();
    document.querySelector('.tab[data-view="map"]').click();
    setTimeout(() => {
      const dot = svg.querySelector(`.dot[data-id="${a.id}"]`);
      if (!dot) return;
      dot.setAttribute('r', '42');
      setTimeout(() => dot.setAttribute('r','26'), 500);
    }, 350);
  });
  scrim.classList.add('open');
  sheet.classList.add('open');
}

function closeSheet() {
  scrim.classList.remove('open');
  sheet.classList.remove('open');
}

scrim.addEventListener('click', closeSheet);
document.getElementById('closeBtn').addEventListener('click', closeSheet);
</script>
